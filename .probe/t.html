<!doctype html><meta charset="utf-8"><body><pre id="o">running</pre><script>
const targets = [
  ['openai','https://api.openai.com/v1/models'],
  ['gemini','https://generativelanguage.googleapis.com/v1beta/models'],
  ['deepseek','https://api.deepseek.com/v1/models'],
  ['openrouter','https://openrouter.ai/api/v1/models'],
  ['perplexity','https://api.perplexity.ai/chat/completions'],
];
const out=[];
(async()=>{
 for(const [n,u] of targets){
   const t=performance.now();
   try{
     const r=await fetch(u,{method:'GET',headers:{Authorization:'Bearer sk-test'}});
     out.push(n+' status='+r.status+' ms='+Math.round(performance.now()-t));
   }catch(e){
     out.push(n+' THROW '+e.name+': '+e.message+' ms='+Math.round(performance.now()-t));
   }
 }
 document.getElementById('o').textContent=out.join('\n');
})();
</script>
